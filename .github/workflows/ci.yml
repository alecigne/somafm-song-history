---
name: CI

"on":
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/alecigne/somafm-song-history
  DEV_IMAGE: docker.io/alecigne/somafm-song-history:dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect changes outside documentation
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            build:
              - '**'
              - '!*.md'
              - '!doc/**'

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Run unit tests
        run: just unit-test-coverage

      - name: Upload unit coverage data
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-data
          path: target/coverage/unit.exec
          if-no-files-found: error
          retention-days: 1

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Run integration tests
        run: just integration-test-coverage

      - name: Upload integration coverage data
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage-data
          path: target/coverage/integration.exec
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Combined coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - unit-tests
      - integration-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Download coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: '*-coverage-data'
          merge-multiple: true
          path: target/coverage

      - name: Generate combined report
        run: just coverage-report

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          badges-directory: target/site/jacoco
          coverage-badge-filename: badge.svg

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: error
          retention-days: 1

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/site/jacoco

  coverage-pages:
    name: Publish coverage to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: coverage
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy coverage report
        id: deployment
        uses: actions/deploy-pages@v4

  package:
    name: Package application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - unit-tests
      - integration-tests
    if: needs.changes.outputs.build == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Package application
        run: just package

      - name: Upload packaged application
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/somafm-song-history-with-dependencies.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packaged application
        uses: actions/download-artifact@v7
        with:
          name: application-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && env.DEV_IMAGE || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
